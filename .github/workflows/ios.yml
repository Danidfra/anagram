name: iPhone app
on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ''
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webkit:
    if: vars.IOS_BUILDS_ENABLED == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install webkit
      - name: Test iPhone layout and WebKit streaming media
        # Browser tests cover viewport/codec behavior, not native permissions,
        # Keychain, audio routing or delivery while the device is locked.
        run: npm run test:e2e:local -- --browser webkit e2e/ios-layout.spec.ts e2e/call-playback.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-webkit-diagnostics
          path: test-results/
          retention-days: 14
  ios:
    # Repository switch for standalone and reusable iPhone builds.
    if: vars.IOS_BUILDS_ENABLED == 'true'
    needs: webkit
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
      IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'app-store-connect' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios
      - run: npm ci
      - name: Set release version
        if: inputs.release_tag != ''
        run: npm run release:version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
      - run: npm run verify:iroh
      - name: Install Xcode tooling
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodebuild -version
          # Device builds use the installed SDK; no simulator runtime is needed.
          xcrun --sdk iphoneos --show-sdk-path
      - name: Generate iPhone project
        run: |
          if [[ -z "${APPLE_DEVELOPMENT_TEAM:-}" ]]; then unset APPLE_DEVELOPMENT_TEAM; fi
          npm run tauri -- ios init --ci
          node scripts/mobile-version.mjs
          npm run tauri -- icon src-tauri/icons/icon.png --output src-tauri/icons
      - name: Build and package iPhone app
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: bash scripts/package-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-ios
          path: mobile-assets/*.ipa
          if-no-files-found: error
          retention-days: 14
