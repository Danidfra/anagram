name: Desktop release
on:
  push:
    tags: ['v*', '[0-9]*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Set version from tag
        run: npm run release:version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: npm run verify:iroh
      - run: npm run quality:all
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:pwa
      - uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: build/
          if-no-files-found: error
          retention-days: 7
  desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev xdg-utils
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - run: npm ci
      - name: Set version from tag
        run: npm run release:version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: npm run verify:iroh
      - name: Configure optional Apple signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          for (const name of ['APPLE_CERTIFICATE', 'APPLE_CERTIFICATE_PASSWORD', 'APPLE_SIGNING_IDENTITY', 'APPLE_ID', 'APPLE_PASSWORD', 'APPLE_TEAM_ID']) {
            const value = process.env[name];
            if (value) appendFileSync(process.env.GITHUB_ENV, `${name}<<ANAGRAM_SIGNING_VALUE\n${value}\nANAGRAM_SIGNING_VALUE\n`);
          }
          JS
      - name: Build installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        with:
          tauriScript: npm run tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: desktop-[platform]-[arch]-[bundle]
  publish:
    needs: [verify, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: web-app
          path: web-app
      - name: Package web app and checksums
        run: |
          shopt -s nullglob
          exes=(release-assets/*.exe)
          dmgs=(release-assets/*.dmg)
          appimages=(release-assets/*.AppImage)
          [[ ${#exes[@]} -eq 1 && ${#dmgs[@]} -eq 2 && ${#appimages[@]} -eq 1 ]]
          cd web-app
          zip -qr ../release-assets/anagram-web.zip .
          cd ../release-assets
          sha256sum ./* > SHA256SUMS.txt
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "Anagram $RELEASE_TAG" --generate-notes "${flags[@]}"
          fi
